<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">LMR</title>
  <desc id="desc">Logo vectorial de LMR, un lenguaje de programación.</desc>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20E3B2"/>
      <stop offset="1" stop-color="#00A982"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD477"/>
      <stop offset="1" stop-color="#E6A83C"/>
    </linearGradient>
  </defs>

  <!-- Emblema: sintaxis, estructura y una instrucción en ejecución. -->
  <g transform="translate(22 20)">
    <rect x="0" y="0" width="180" height="180" rx="38" fill="#121920"/>
    <rect x="1" y="1" width="178" height="178" rx="37" fill="none" stroke="#26343D" stroke-width="2"/>
    <path d="M53 60 30 90l23 30" fill="none" stroke="url(#mint)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m127 60 23 30-23 30" fill="none" stroke="url(#mint)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M69 120V70l21 25 21-25v50" fill="none" stroke="#F3F7F8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="119" cy="57" r="7" fill="url(#amber)"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="246" y="131" fill="#F3F7F8" font-size="104" font-weight="800" letter-spacing="8">LMR</text>
    <rect x="252" y="157" width="72" height="6" rx="3" fill="url(#mint)"/>
    <rect x="332" y="157" width="22" height="6" rx="3" fill="url(#amber)"/>
  </g>
</svg>
